<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Arkanoïd</title>
	</head>
	<body>
		<h1>Arkanoïd</h1>

		<!--Data du jeu -->
		<div class="hud">
			<span id="score" class="score">0</span>
			<span id="life" class="life">3</span>
		</div>

		<!-- Modal Victoire -->
		<div id="modal-win" class="modal-container hidden">
			<div class="modal-box">
				<h2 class="modal-title">Victoire!</h2>
				<p id="score-victory" class="modal-score">Score: 0</p>
				<button id="btn-continue" class="modal-button">Continuer</button>
				<button id="btn-menu-victory" class="modal-button">Menu</button>
			</div>
		</div>

		<!-- Modal Défaite -->
		<div id="modal-loose" class="modal-container hidden">
			<div class="modal-box">
				<h2 class="modal-title">Défaite!</h2>
				<p id="score-defeat" class="modal-score">Score: 0</p>
				<button id="btn-retry" class="modal-button">Rejouer</button>
				<button id="btn-menu-loose" class="modal-button">Menu</button>
			</div>
		</div>

		<!-- Modal Menu du jeu-->
		<div id="modal-menu" class="modal-container">
			<div class="modal-box">
				<h2 class="modal-title">Menu Principal</h2>

				<!-- Conteneur des cartes de thème -->
				<div
					class="themes-container">
					<!-- Card Thème Space -->
					<div class="theme-card" data-theme="space">
						<div class="theme-card-image space-bg"></div>
						<h3 class="theme-name">Space</h3>
					</div>

					<!-- Card Thème 8-bit -->
					<div class="theme-card" data-theme="8bit">
						<div class="theme-card-image bit-bg"></div>
						<h3 class="theme-name">8-bit</h3>
					</div>
				</div>

				<!-- Bouton Jouer -->
				<button id="btn-play" class="modal-button btn-play">Jouer</button>
			</div>
		</div>

	</body>
</html>
