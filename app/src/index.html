<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Arkanoïd</title>
	</head>
	<body>
		<h1>Arkanoïd</h1>

		<span id="score" class="score">0</span>

		<!-- Modal Victoire -->
		<div id="modal-win" class="modal-container hidden">
			<div class="modal-box">
				<h2 class="modal-title">Victoire!</h2>
				<p id="score-victory" class="modal-score">Score: 0</p>
				<button id="btn-continue" class="modal-button">Continuer</button>
				<button id="btn-menu" class="modal-button">Menu</button>
			</div>
		</div>

		<!-- Modal Défaite -->
		<div id="modal-loose" class="modal-container hidden">
			<div class="modal-box">
				<h2 class="modal-title">Défaite!</h2>
				<p id="score-defeat" class="modal-score">Score: 0</p>
				<button id="btn-retry" class="modal-button">Rejouer</button>
				<button id="btn-menu" class="modal-button">Menu</button>
			</div>
		</div>

		<!-- Modal Menu du jeu-->
		<div id="modal-menu" class="modal-container hidden">
			<div class="modal-box">
				<h2 class="modal-title">Menu Principal</h2>
				<button id="btn-retry" class="modal-button">Jouer</button>
			</div>
		</div>

		
	</body>
</html>
